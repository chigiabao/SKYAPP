# The iOS artifact is unsigned: it requires provisioning and signing before installation.
name: Build iOS / Web / Android

on:
  push:
    branches: [main]
  # PR: chi chay analyze/test (cac job build bo qua khi pull_request).
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend URL: HTTPS or local-network HTTP. Required for iOS (input or repo variable API_BASE_URL)."
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.7"
  # Uu tien input khi chay tay, roi bien repo (Settings > Variables).
  API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL || '' }}

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INGEST_ENABLED: '0'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
        working-directory: backend
      - name: Python correctness lint
        run: python -m ruff check --config backend/ruff.toml backend tool
      - name: Coverage gate self-check
        run: python -m unittest discover -s tool -p test_check_coverage.py
      - name: Backend regression tests
        run: >-
          python -m pytest tests -q -p no:cacheprovider -p pytest_cov
          --skip-model-training --cov=. --cov-config=.coveragerc
          --cov-report=term-missing:skip-covered --cov-report=xml:../build/backend-coverage.xml
          --junitxml=../build/backend-tests.xml
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            build/backend-tests.xml
            build/backend-coverage.xml
          if-no-files-found: ignore

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: flutter analyze
        run: flutter analyze --no-pub
      # Test golden gan @Tags(['golden']) (dart_test.yaml) chay o job golden.
      - name: flutter test (tru golden, co coverage)
        run: flutter test --no-pub --exclude-tags golden --coverage --concurrency=1
      - name: Flutter line coverage gate
        run: python3 tool/check_coverage.py coverage/lcov.info --minimum 80
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend contract dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Flutter to FastAPI contract (isolated synthetic DB)
        run: python tool/run_backend_contract.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-contract-log
          path: build/backend-contract-api.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-coverage-lcov
          path: coverage/lcov.info
          retention-days: 14
          if-no-files-found: warn

  # Anh golden tao tren Windows (font/anti-alias phu thuoc nen tang) nen so
  # tren cung OS; golden fail se chan build.
  golden:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: flutter test (golden)
        run: flutter test --no-pub --tags golden
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-failures
          path: test/**/failures/
          retention-days: 7
          if-no-files-found: ignore

  ios:
    needs: [test, golden, backend-test]
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Validate iOS backend URL
        shell: bash
        run: |
          python3 - <<'PY'
          import ipaddress
          import os
          from urllib.parse import urlsplit

          raw = os.environ.get('API_BASE_URL', '')
          try:
              url = urlsplit(raw)
              port = url.port
              assert raw and raw == raw.strip() and not any(c.isspace() for c in raw)
              assert url.scheme in ('http', 'https') and url.hostname
              assert not url.username and not url.password and not url.query and not url.fragment
              assert port is None or 0 < port <= 65535
              host = url.hostname.lower().rstrip('.')
              assert host not in ('localhost', '10.0.2.2') and not host.endswith('.localhost')
              try:
                  address = ipaddress.ip_address(host)
              except ValueError:
                  address = None
              if address is not None:
                  assert not (address.is_loopback or address.is_unspecified or address.is_multicast or address.is_link_local)
              if url.scheme == 'http':
                  assert (address is not None and address.is_private) or (address is None and ('.' not in host or host.endswith('.local')))
          except (ValueError, AssertionError):
              raise SystemExit('Set API_BASE_URL to a real HTTPS backend or local-network HTTP host; loopback/emulator URLs are not usable on an iPhone.')
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build simulator and run native configuration tests
        shell: bash
        run: |
          flutter build ios --simulator --debug --no-codesign "--dart-define=API_BASE_URL=$API_BASE_URL"
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime, group in devices.items() if "iOS" in runtime for d in group if d["name"].startswith("iPhone")))')
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -parallel-testing-enabled NO \
            -resultBundlePath build/ios/RunnerTests.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SkyWeather-ios-native-tests
          path: build/ios/RunnerTests.xcresult
          if-no-files-found: ignore
          retention-days: 14
      - name: flutter build ios (khong ky)
        run: |
          flutter build ios --release --no-codesign "--dart-define=API_BASE_URL=$API_BASE_URL"
      - name: Dong goi SkyWeather-unsigned.ipa
        run: |
          cd build/ios/iphoneos
          rm -rf Payload SkyWeather-unsigned.ipa
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qry SkyWeather-unsigned.ipa Payload
          ls -lh SkyWeather-unsigned.ipa
          printf '%s\n' '### iOS unsigned build' \
            'Native simulator tests passed. The IPA is NOT signed or directly installable.' \
            'Device installation requires a valid signing identity and provisioning profile; no signing was performed.' \
            'Backend reachability, permissions and background delivery still require a real-device check.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: SkyWeather-unsigned-ipa
          path: build/ios/iphoneos/SkyWeather-unsigned.ipa
          retention-days: 14
          if-no-files-found: error

  web:
    needs: [test, golden, backend-test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Test same-origin web configuration
        run: flutter test --no-pub --platform chrome test/web_origin_test.dart
      - name: flutter build web
        run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: SkyWeather-web
          path: build/web
          retention-days: 14

  android:
    needs: [test, golden, backend-test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate backend URL
        shell: bash
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::Set API_BASE_URL (workflow input or repo variable) before building Android; an empty URL ships a build that cannot reach the backend."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: flutter build apk --debug
        run: flutter build apk --debug "--dart-define=API_BASE_URL=$API_BASE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: SkyWeather-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
