name: Backend Health Tests

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-health-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      INGEST_ENABLED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install existing backend test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint with ruff
        run: python -m ruff check .
      - name: Prepare temporary test and report directory
        run: mkdir -p ../build/backend-health-tests
      # Ingestion uses mocked HTTP; the explicit files exclude the model-training fixture.
      - name: Readiness, ingestion and health regression gate (no training)
        run: >-
          python -m pytest
          tests/test_readiness.py tests/test_cold_start.py
          tests/test_ingest.py tests/test_ingest_reliability.py
          tests/test_contract.py::test_health
          tests/test_multilocation.py::test_health_cells
          -q -ra -p no:cacheprovider
          --basetemp=../build/backend-health-tests/tmp
          --junitxml=../build/backend-health-tests/pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-health-test-results
          path: build/backend-health-tests/pytest.xml
          if-no-files-found: ignore
